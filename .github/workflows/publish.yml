name: Publish to PyPI

# Trusted Publisher flow (PEP 722-style): this workflow is bound on the PyPI
# side to cloudydreamland/Charaudit with environment `pypi`. UNTIL the user
# binds the Trusted Publisher on pypi.org, uploads would be rejected — so the
# publish job is additionally gated on the repository variable
# PUBLISH_ENABLED == "true". Default state: gate off, releases build and
# attach artifacts but never touch PyPI.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Publish gate
        id: check
        run: |
          if [ "${{ vars.PUBLISH_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "PUBLISH_ENABLED=true — Trusted Publisher is expected to be bound."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PUBLISH_ENABLED is not 'true' — building artifacts only, no PyPI upload."
          fi

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version consistency (tag vs pyproject)
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJ_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG_VERSION pyproject=$PROJ_VERSION"
          [ "$TAG_VERSION" = "$PROJ_VERSION" ] || { echo "version mismatch"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
