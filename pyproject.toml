[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charaudit"
version = "0.1.0a1"
description = "Chinese-first invisible-character auditing for prompts, corpora, and text pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cloudydreamland" }]
keywords = ["unicode", "invisible-characters", "homoglyph", "confusables", "prompt-injection", "audit", "chinese", "llm", "text-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/cloudydreamland/Charaudit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
charaudit = ["data/*.json"]
